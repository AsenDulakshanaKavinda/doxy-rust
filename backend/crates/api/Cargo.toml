[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.1.0", path = "../config" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }

# Tracing and Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Tower HTTP Middleware
tower-http = { version = "0.5", features = ["trace", "request-id", "util"] }
tower = "0.4"

diesel = { version = "2", features = ["postgres", "chrono", "serde_json", "postgres_backend", "r2d2"] }
diesel-derive-enum = { version = "2", features = ["postgres"] }
serde_json = "1"
dotenvy = "0.15.7"
uuid = { version = "1.11", features = ["v4"] }



[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"
serde_json = "1"
